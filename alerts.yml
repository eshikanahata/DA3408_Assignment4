groups:
  - name: caption-monitoring
    rules:
      - alert: CaptionAppDown
        expr: up{job="caption_app"} == 0
        for: 15s
        labels: {severity: critical}
        annotations: {summary: "Captioning app is not reachable"}

      - alert: HighInferenceLatencyP95
        expr: histogram_quantile(0.95, sum by (le) (rate(caption_inference_duration_seconds_bucket[1m]))) > 5
        for: 30s
        labels: {severity: warning}
        annotations: {summary: "p95 inference latency above 5s"}

      - alert: HostCPUHigh
        expr: 100 - avg(rate(node_cpu_seconds_total{mode="idle"}[1m])) * 100 > 90
        for: 1m
        labels: {severity: warning}
        annotations: {summary: "Host CPU above 90%"}

      - alert: CaptionErrorsDetected
        expr: sum(increase(caption_errors_total[5m])) > 0
        labels: {severity: warning}
        annotations: {summary: "Captioning errors in the last 5 minutes"}
