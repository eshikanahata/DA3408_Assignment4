global:
  scrape_interval: 5s      
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
  - job_name: caption_app
    static_configs:
      - targets: ["localhost:8000"]
        labels:
          service: image-captioning
  - job_name: node
    static_configs:
      - targets: ["localhost:9100"]
        labels:
          service: host
